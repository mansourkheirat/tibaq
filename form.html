<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نماذج الألوان</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        padding: 20px;
    }
    .color-box {
        padding: 16px 20px;
        margin-bottom: 12px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="color-box" style="color:#1a1a1a; background:#e5e5e5;">
    نص داكن جدًا على خلفية رمادية فاتحة
</div>

<div class="color-box" style="color:#dc2626; background:#fee2e2;">
    نص أحمر تحذيري على خلفية وردية فاتحة
</div>

<div class="color-box" style="color:#92400e; background:#fef3c7;">
    نص بني مائل للذهبي على خلفية صفراء ناعمة
</div>

<div class="color-box" style="color:#ea580c; background:#ffedd5;">
    نص برتقالي واضح على خلفية برتقالية فاتحة
</div>

<div class="color-box" style="color:#166534; background:#dcfce7;">
    نص أزرق ملكي على خلفية زرقاء سماوية
</div>

<div class="color-box" style="color:#1976d2; background:#e3f2fd;">
    نص أزرق هادئ على خلفية زرقاء شديدة الفتح
</div>

</body>
</html>
